<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Luz y Aroma</title>
  <meta name="description" content="Inicia sesión en Luz y Aroma, velas artesanales aromáticas.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <section class="auth-contenedor tarjeta p-4 p-md-5" aria-labelledby="titulo-login">
      <h1 id="titulo-login" class="h3 text-center mb-1">Iniciar sesión</h1>
      <p class="text-center text-muted mb-4">Qué bueno verte de nuevo</p>

      <div id="alerta-login" class="alert alert-danger d-none" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-ambar w-100" id="btn-login">Entrar</button>
      </form>

      <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html" id="enlace-registro">Regístrate</a></p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 Luz y Aroma · Velas artesanales aromáticas</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
