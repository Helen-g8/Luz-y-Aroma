<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Luz y Aroma</title>
  <meta name="description" content="Crea tu cuenta en Luz y Aroma para comprar velas artesanales.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <section class="auth-contenedor tarjeta p-4 p-md-5" aria-labelledby="titulo-registro">
      <h1 id="titulo-registro" class="h3 text-center mb-1">Crear cuenta</h1>
      <p class="text-center text-muted mb-4">Regístrate para hacer tus pedidos</p>

      <div id="alerta-registro" class="alert alert-danger d-none" role="alert"></div>

      <form id="form-registro" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name" maxlength="60" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required aria-describedby="ayuda-password">
          <div id="ayuda-password" class="form-text">Mínimo 6 caracteres.</div>
        </div>
        <div class="mb-4">
          <label for="confirmar" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="confirmar" name="confirmar" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-ambar w-100" id="btn-registro">Crear cuenta</button>
      </form>

      <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="login.html" id="enlace-login">Inicia sesión</a></p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 Luz y Aroma · Velas artesanales aromáticas</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/registro.js"></script>
</body>
</html>
