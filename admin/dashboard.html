
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel | Luz y Aroma</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/pedidos.css" rel="stylesheet">
</head>

<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 mb-0">Panel de indicadores</h1>
        <p class="text-muted small mb-0">
          Resumen de ventas, pedidos e inventario
        </p>
      </div>

      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        id="btn-recargar"
      >
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
        Actualizar
      </button>
    </div>

    <div id="contenido"></div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 Luz y Aroma · Panel de administración
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/dashboard.js"></script>

</html>
