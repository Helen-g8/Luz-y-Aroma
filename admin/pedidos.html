
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar pedidos | Luz y Aroma</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/pedidos.css" rel="stylesheet">
</head>

<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0">Pedidos</h1>
        <p class="text-muted small mb-0" id="resumen-pedidos" aria-live="polite"></p>
      </div>

      <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-recargar">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Actualizar
      </button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label for="filtro-estado" class="form-label small mb-1">Estado</label>
        <select id="filtro-estado" class="form-select"></select>
      </div>

      <div class="col-md-8">
        <label for="buscador" class="form-label small mb-1">Buscar</label>
        <input
          type="search"
          id="buscador"
          class="form-control"
          placeholder="Cliente, correo o número de pedido..."
        >
      </div>
    </div>

    <div id="contenido"></div>
  </main>

  <!-- Modal: detalle del pedido -->
  <div
    class="modal fade"
    id="modal-detalle"
    tabindex="-1"
    aria-labelledby="titulo-detalle"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-detalle">Pedido</h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>

        <div class="modal-body" id="cuerpo-detalle"></div>
      </div>
    </div>
  </div>

  <!-- Modal: confirmar eliminación -->
  <div
    class="modal fade"
    id="modal-eliminar"
    tabindex="-1"
    aria-labelledby="titulo-eliminar-pedido"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-eliminar-pedido">
            Eliminar pedido
          </h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>

        <div class="modal-body">
          ¿Seguro que quieres eliminar el pedido cancelado
          <strong id="numero-eliminar"></strong>?
          Esta acción no se puede deshacer.
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-dismiss="modal"
          >
            Cancelar
          </button>

          <button
            type="button"
            class="btn btn-danger"
            id="btn-confirmar-eliminar"
          >
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      © 2026 Luz y Aroma · Panel de administración
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/admin-pedidos.js"></script>
</body>
</html>
