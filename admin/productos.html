<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar velas | Luz y Aroma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/catalogo.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0">Velas</h1>
        <p class="text-muted small mb-0" id="resumen-velas" aria-live="polite"></p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-ambar d-none" id="btn-datos-iniciales">
          <i class="bi bi-database-add" aria-hidden="true"></i> Cargar datos iniciales
        </button>
        <button type="button" class="btn btn-ambar" id="btn-nueva">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva vela
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label for="buscador" class="visually-hidden">Buscar vela</label>
      <input type="search" id="buscador" class="form-control" placeholder="Buscar por nombre o aroma...">
    </div>

    <div id="contenido"></div>
  </main>

  <!-- Modal: crear / editar vela -->
  <div class="modal fade" id="modal-vela" tabindex="-1" aria-labelledby="titulo-modal-vela" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-vela">Nueva vela</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="form-vela" novalidate>
            <div class="row g-3">
              <div class="col-md-8">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" id="nombre" name="nombre" class="form-control" maxlength="60" required>
              </div>
              <div class="col-md-4">
                <label for="tamano" class="form-label">Tamaño *</label>
                <select id="tamano" name="tamano" class="form-select" required>
                  <option value="">Elegir...</option>
                </select>
              </div>
              <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" name="descripcion" class="form-control" rows="2" maxlength="300"></textarea>
              </div>
              <div class="col-md-4">
                <label for="aroma" class="form-label">Aroma *</label>
                <select id="aroma" name="aroma" class="form-select" required>
                  <option value="">Elegir...</option>
                </select>
              </div>
              <div class="col-6 col-md-4">
                <label for="precio" class="form-label">Precio (US$) *</label>
                <input type="number" id="precio" name="precio" class="form-control" min="0.01" max="100" step="0.01" inputmode="decimal" required>
              </div>
              <div class="col-6 col-md-4">
                <label for="stock" class="form-label">Stock *</label>
                <input type="number" id="stock" name="stock" class="form-control" min="0" step="1" inputmode="numeric" required>
              </div>
              <div class="col-12">
                <label for="imagenUrl" class="form-label">URL de imagen (opcional)</label>
                <input type="url" id="imagenUrl" name="imagenUrl" class="form-control" placeholder="https://...">
              </div>
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="activo" name="activo" checked>
                  <label class="form-check-label" for="activo">Visible en el catálogo</label>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="form-vela" class="btn btn-ambar" id="btn-guardar">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: confirmar eliminación -->
  <div class="modal fade" id="modal-eliminar" tabindex="-1" aria-labelledby="titulo-modal-eliminar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal-eliminar">Eliminar vela</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">¿Seguro que quieres eliminar <strong id="nombre-eliminar"></strong>?</p>
          <p class="small text-muted mb-0">Esta acción no se puede deshacer. Si solo quieres quitarla del catálogo, mejor ocúltala.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">© 2026 Luz y Aroma · Panel de administración</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/pages/admin-productos.js"></script>
</body>
</html>
