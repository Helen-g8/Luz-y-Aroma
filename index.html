<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Luz y Aroma</title>
  <meta name="description" content="Velas artesanales aromáticas hechas a mano en El Salvador.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/catalogo.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main>
    <section class="hero">
      <div class="container py-5 text-center">
        <h1 class="display-5 fw-bold">Velas que iluminan y perfuman tu hogar</h1>
        <p class="lead mb-0">Velas artesanales aromáticas hechas a mano en El Salvador.</p>
      </div>
    </section>

    <section class="container py-4" aria-labelledby="titulo-catalogo">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <h2 id="titulo-catalogo" class="h3 mb-0">Nuestro catálogo</h2>
        <span id="contador-resultados" class="text-muted small" aria-live="polite"></span>
      </div>

      <form id="form-filtros" class="filtros tarjeta p-3 mb-4" role="search" aria-label="Filtrar velas">
        <div class="row g-2">
          <div class="col-md-5">
            <label for="buscador" class="form-label small">Buscar</label>
            <input type="search" id="buscador" class="form-control" placeholder="Nombre o aroma...">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-aroma" class="form-label small">Aroma</label>
            <select id="filtro-aroma" class="form-select">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="orden" class="form-label small">Ordenar por</label>
            <select id="orden" class="form-select">
              <option value="destacados">Disponibles primero</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="nombre">Nombre (A–Z)</option>
            </select>
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button type="reset" class="btn btn-outline-secondary w-100" aria-label="Limpiar filtros" title="Limpiar filtros">
              <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </form>

      <div id="lista-velas" class="row g-4"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 Luz y Aroma · Velas artesanales aromáticas</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/catalogo.js"></script>
</body>
</html>
