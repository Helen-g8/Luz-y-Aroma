
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Luz y Aroma</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/pedidos.css" rel="stylesheet">
</head>

<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <h1 class="h3 mb-4">Tu carrito</h1>

    <div class="row g-4">
      <section class="col-lg-7" aria-label="Artículos del carrito">
        <div id="lista-carrito"></div>
      </section>

      <aside class="col-lg-5 d-none" id="columna-resumen" aria-labelledby="titulo-resumen">
        <div class="tarjeta p-4 resumen-pedido">
          <h2 id="titulo-resumen" class="h5">Resumen</h2>

          <dl class="row mb-2">
            <dt class="col-6 fw-normal">Subtotal</dt>
            <dd class="col-6 text-end mb-1" id="subtotal">$0.00</dd>

            <dt class="col-6 fw-normal">Envío</dt>
            <dd class="col-6 text-end mb-1" id="envio">$0.00</dd>

            <dt class="col-6">Total</dt>
            <dd class="col-6 text-end fw-bold fs-5 mb-0" id="total">$0.00</dd>
          </dl>

          <p id="aviso-envio" class="alert alert-warning py-2 small d-none mb-0" aria-live="polite"></p>

          <hr>

          <h3 class="h6">Datos de entrega</h3>

          <div id="aviso-sesion" class="alert alert-info small d-none">
            Para confirmar tu pedido necesitas
            <a href="login.html?volver=carrito.html">iniciar sesión</a> o
            <a href="registro.html?volver=carrito.html">crear una cuenta</a>.
          </div>

          <form id="form-entrega" novalidate>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección de entrega *</label>
              <textarea
                id="direccion"
                name="direccion"
                class="form-control"
                rows="2"
                maxlength="200"
                required
                placeholder="Colonia, calle, número de casa, municipio"
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono *</label>
              <input
                type="tel"
                id="telefono"
                name="telefono"
                class="form-control"
                inputmode="numeric"
                maxlength="9"
                placeholder="7123-4567"
                autocomplete="tel"
                required
              >
            </div>

            <div class="mb-3">
              <label for="notas" class="form-label">Notas (opcional)</label>
              <textarea
                id="notas"
                name="notas"
                class="form-control"
                rows="2"
                maxlength="200"
                placeholder="Ej.: es para regalo, entregar después de las 5 p. m."
              ></textarea>
            </div>

            <button
              type="submit"
              class="btn btn-ambar w-100"
              id="btn-confirmar"
            >
              Confirmar pedido
            </button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 Luz y Aroma · Velas artesanales aromáticas
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/carrito.js"></script>
</body>
</html>
